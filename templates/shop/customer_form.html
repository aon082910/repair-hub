{% extends "base.html" %}
{% block title %}Add Customer - Repair-Hub{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <h2 style="margin-top:0;">Add Customer</h2>
  <form method="post">
    {% csrf_token %}
    <label>Name</label>
    <input type="text" name="name" required>
    <label>Phone</label>
    <input type="tel" name="phone">
    <label>Email</label>
    <input type="email" name="email">
    <label>Address</label>
    <input type="text" name="address">
    <button class="btn" type="submit" style="margin-top:1.25rem;">Save Customer</button>
  </form>
</div>
{% endblock %}
