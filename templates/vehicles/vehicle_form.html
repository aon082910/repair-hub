{% extends "base.html" %}
{% block title %}Add Vehicle - Repair-Hub{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;">
  <h2 style="margin-top:0;">Add Vehicle</h2>
  <form method="post">
    {% csrf_token %}
    <label>VIN (optional — auto-fills fields below via NHTSA lookup)</label>
    <input type="text" id="vin" name="vin" maxlength="17" placeholder="17-character VIN">
    <label>Year</label>
    <input type="number" id="year" name="year" required min="1950" max="2100">
    <label>Make</label>
    <input type="text" id="make" name="make" required>
    <label>Model</label>
    <input type="text" id="model" name="model" required>
    <label>Trim</label>
    <input type="text" id="trim" name="trim">
    <label>Engine</label>
    <input type="text" id="engine" name="engine">
    <button class="btn" type="submit" style="margin-top:1.25rem;">Save Vehicle</button>
  </form>
</div>
<script>
document.getElementById('vin').addEventListener('change', async function () {
  const vin = this.value.trim();
  if (vin.length !== 17) return;
  try {
    const resp = await fetch('{% url "vehicles:vin_lookup" %}?vin=' + encodeURIComponent(vin));
    const data = await resp.json();
    if (data.year) document.getElementById('year').value = data.year;
    if (data.make) document.getElementById('make').value = data.make;
    if (data.model) document.getElementById('model').value = data.model;
    if (data.trim) document.getElementById('trim').value = data.trim;
    if (data.engine) document.getElementById('engine').value = data.engine;
  } catch (e) {
    console.warn('VIN lookup unavailable (offline?)', e);
  }
});
</script>
{% endblock %}
